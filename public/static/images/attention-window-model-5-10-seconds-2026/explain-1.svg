<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <rect width="900" height="520" fill="#111827" />
  <text x="450" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Bad Open vs Good Open</text>
  <rect x="60" y="95" width="360" height="360" rx="16" fill="#2b1d1d" stroke="#fb7185" stroke-width="2" />
  <text x="240" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#fecdd3">Swipe-Away Open</text>
  <text x="90" y="182" font-family="Arial, sans-serif" font-size="15" fill="#ffe4e6">• Silent first seconds</text>
  <text x="90" y="212" font-family="Arial, sans-serif" font-size="15" fill="#ffe4e6">• No visible objective</text>
  <text x="90" y="242" font-family="Arial, sans-serif" font-size="15" fill="#ffe4e6">• Static camera scene</text>
  <text x="90" y="272" font-family="Arial, sans-serif" font-size="15" fill="#ffe4e6">• Generic title mismatch</text>
  <text x="90" y="328" font-family="Arial, sans-serif" font-size="14" fill="#fda4af">Result: exits in 5–10 seconds</text>
  <rect x="480" y="95" width="360" height="360" rx="16" fill="#1a2a20" stroke="#4ade80" stroke-width="2" />
  <text x="660" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#bbf7d0">Retention Open</text>
  <text x="510" y="182" font-family="Arial, sans-serif" font-size="15" fill="#dcfce7">• Immediate verbal hook</text>
  <text x="510" y="212" font-family="Arial, sans-serif" font-size="15" fill="#dcfce7">• On-screen goal in 1 line</text>
  <text x="510" y="242" font-family="Arial, sans-serif" font-size="15" fill="#dcfce7">• Motion every 2–3 seconds</text>
  <text x="510" y="272" font-family="Arial, sans-serif" font-size="15" fill="#dcfce7">• Tight title-context match</text>
  <text x="510" y="328" font-family="Arial, sans-serif" font-size="14" fill="#86efac">Result: survives first window</text>
</svg>
