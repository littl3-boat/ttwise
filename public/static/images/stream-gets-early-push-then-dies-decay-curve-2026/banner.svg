<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <!-- Background -->
  <rect width="1200" height="600" fill="#000000" />
  
  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#grad1)" />

  <!-- Main Title -->
  <text x="600" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="56" fill="#ffffff">
    EARLY PUSH
  </text>
  <text x="600" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="56" fill="#ff4444">
    THEN DEATH?
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#aaaaaa">
    The "Honeymoon Cliff" Explained
  </text>

  <!-- Visual Metaphor: The Cliff -->
  <!-- Graph Line -->
  <path d="M200 450 L300 200 L400 450 L1000 450" stroke="#ff4444" stroke-width="8" fill="none" stroke-linejoin="round" />
  
  <!-- Labels -->
  <text x="300" y="180" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#44ff44">0-10 MINS</text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#ff4444">THE CLIFF</text>
  <text x="800" y="480" text-anchor="middle" font-family="Arial" font-size="18" fill="#aaaaaa">The "Dead Zone"</text>

</svg>